name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # Weekly, for the rough check of the default thresholds.
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Builds the library and runs `lake test`, whose `#guard`s check results against `Nat`.
      - name: build and test
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: true

      # `lake build` does not build the executables.
      - name: build tune and bench
        run: lake build --wfail tune bench

      # Shared runners are noisy, so the thresholds found are only a rough check of the defaults
      # in `MPN.Config`; they go into the run's summary.
      - name: tune
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo '## Thresholds on the runner'
            echo '```'
            lake exe tune
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
