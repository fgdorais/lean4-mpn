name: CI

on:
  push:
    branches: [ "main64" ]
  pull_request:
    branches: [ "main64" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Builds the library and runs `lake test`, whose `#guard`s check results against `Nat`.
      - name: build and test
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: true

      # `lake build` does not build the benchmark.
      - name: build bench
        run: lake build --wfail bench
