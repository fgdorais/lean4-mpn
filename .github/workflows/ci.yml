name: CI

on:
  push:
    branches: [ "main", "unified" ]
  pull_request:
    branches: [ "main", "unified" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Builds the library and runs `lake test`, whose `#guard`s check results against `Nat`.
      - name: build and test
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: true

      # `MPN32` and the shared `MPN` must build wherever Lean does: no C of their own, no `MPN64`,
      # and only the Lean runtime's functions in the C of their dependency.
      - name: portability of MPN32
        run: python3 scripts/check_portable.py

      # `lake build` does not build the executables.
      - name: build tune and bench
        run: lake build --wfail tune32 bench32 tune64 bench64
