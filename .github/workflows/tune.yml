name: Tune

on:
  workflow_dispatch:
  schedule:
    # Weekly, as a rough check of the default thresholds in `MPN32.Config` and `MPN64.Config`.
    - cron: "17 5 * * 1"

jobs:
  tune:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [ "32", "64" ]
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: build
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: "tune${{ matrix.width }}"

      # Shared runners are noisy and their machines vary, so the thresholds found are only a rough
      # check of the defaults; with `--verbose` the log shows the timings at each size, so how clear
      # each crossover is. They go into the log, the run's summary and an artifact.
      - name: tune
        run: |
          cpu="Runner: $(nproc) cores, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          echo "$cpu" | tee tune.txt
          .lake/build/bin/tune${{ matrix.width }} --verbose | tee -a tune.txt
          {
            echo '## Thresholds of ${{ matrix.width }}-bit limbs on the runner'
            echo
            echo '```'
            cat tune.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tune${{ matrix.width }}
          path: tune.txt
