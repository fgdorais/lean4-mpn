name: Tune

on:
  workflow_dispatch:
  schedule:
    # Weekly, as a rough check of the default thresholds in `MPN.Config`.
    - cron: "17 5 * * 1"

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: build
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: "tune"

      # Shared runners are noisy and their machines vary, so the thresholds found are only a rough
      # check of the defaults. They go into the log, the run's summary and an artifact.
      - name: tune
        run: |
          cpu="Runner: $(nproc) cores, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          echo "$cpu" | tee tune.txt
          lake exe tune | tee -a tune.txt
          {
            echo '## Thresholds on the runner'
            echo
            echo '```'
            cat tune.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tune
          path: tune.txt
