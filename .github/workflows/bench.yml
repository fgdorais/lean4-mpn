name: Bench

on:
  workflow_dispatch:
    inputs:
      ops:
        description: "Operations, separated by spaces (empty: the limb operations)"
        required: false
        default: ""
      sizes:
        description: "Sizes in limbs, separated by spaces (empty: 1 to 4096)"
        required: false
        default: ""

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: build
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: "bench"

      # Shared runners are noisy and their machines vary, so these numbers are a sanity check, not
      # the ones in BENCH.md. The tables go into the run's summary, the raw output into an artifact.
      - name: bench
        env:
          OPS: ${{ inputs.ops }}
          SIZES: ${{ inputs.sizes }}
        run: |
          # shellcheck disable=SC2086
          taskset -c 0 .lake/build/bin/bench $OPS $SIZES | tee bench.txt
          {
            echo '## Bench on the runner'
            echo
            echo "Runner: $(nproc) cores, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
            echo
            python3 scripts/bench_md.py bench.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.txt
