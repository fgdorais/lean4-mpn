name = "lean4-bignum"
version = "0.1.0"
defaultTargets = ["Bignum", "BignumTest"]
testDriver = "BignumTest"

[[lean_lib]]
name = "Bignum"

[[lean_lib]]
name = "BignumTest"
precompileModules = true

[[require]]
name = "lean4-scalar-arrays"
git = "https://github.com/fgdorais/lean4-scalar-arrays"
rev = "main"

[[lean_exe]]
name = "tune"
root = "Tune"

[[lean_exe]]
name = "bench"
root = "Bench"
